<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 40px; }
    label { display: block; margin-top: 16px; font-size: 14px; color: #333; }
    input[type="password"] {
      display: block; width: 100%; margin-top: 6px; padding: 8px; box-sizing: border-box;
    }
    button {
      margin-top: 20px; padding: 10px 16px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    pre { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>관리자 페이지</h1>

  <hr />
  <section id="matmapSeedSection">
    <h2>화성시 맛집 99곳 일괄 등록</h2>
    <p style="font-size:13px;color:#666;">
      버튼을 누르면 화성시 전 지역 맛집 99곳이 서버에 이미 준비된 데이터로 한 번에 등록됩니다. (status: pending)
    </p>
    <form id="matmapSeedForm">
      <label>관리자 비밀 키
        <input type="password" name="secret" required />
      </label>
      <button type="submit">화성시 99곳 등록하기</button>
    </form>
    <pre id="matmapSeedResult" style="display:none;"></pre>
  </section>

  <script>
    (function () {
      const form = document.getElementById('matmapSeedForm');
      const result = document.getElementById('matmapSeedResult');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        result.style.display = 'block';
        result.textContent = '등록 중... (몇 초 걸릴 수 있습니다)';
        const secret = form.secret.value;
        try {
          const res = await fetch('/admin/import-hwaseong-seed', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'secret=' + encodeURIComponent(secret),
          });
          const text = await res.text();
          result.textContent = text;
        } catch (err) {
          result.textContent = '요청 실패: ' + err.message;
        }
      });
    })();
  </script>
</body>
</html>
